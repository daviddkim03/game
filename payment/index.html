<!DOCTYPE html>
<html lang="en">

<head>
  <base href="../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment Report</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f5f2eb;
      --bg2: #ede9e0;
      --bg3: #e4e0d6;
      --ink: #1a1a18;
      --t2: #5f5e5a;
      --t3: #9a9890;
      --br: rgba(0, 0, 0, 0.1);
      --blue: #1a5fa8;
      --font: 'DM Sans', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 0.5px solid var(--br);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      height: 52px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    a.nav-back {
      font-size: 13px;
      color: var(--t2);
      text-decoration: none;
    }

    a.nav-back:hover {
      color: var(--ink);
    }

    .nav-title {
      font-size: 15px;
      font-weight: 500;
    }

    .nav-right {
      display: flex;
      gap: 8px;
    }

    .btn {
      font-family: var(--font);
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      border: 0.5px solid var(--br);
      background: none;
      color: var(--ink);
    }

    .btn:hover {
      background: var(--bg2);
    }

    .btn-primary {
      background: var(--ink);
      color: var(--bg);
      border-color: transparent;
    }

    .btn-primary:hover {
      background: #333;
    }

    .btn-red {
      color: #a32d2d;
      border-color: rgba(163, 45, 45, 0.2);
    }

    .btn-red:hover {
      background: #fcebeb;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 0;
      max-width: 1160px;
      margin: 0 auto;
      min-height: calc(100vh - 52px);
    }

    .sidebar {
      border-right: 0.5px solid var(--br);
      padding: 1.25rem;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .sidebar h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--t3);
      margin-bottom: 8px;
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      font-size: 11px;
      color: var(--t2);
      margin-bottom: 3px;
    }

    .field input,
    .field select {
      width: 100%;
      font-family: var(--font);
      font-size: 13px;
      padding: 7px 9px;
      border: 0.5px solid var(--br);
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink);
      outline: none;
    }

    .field input:focus {
      border-color: #888;
    }

    .student-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .student-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      border: 0.5px solid var(--br);
      background: var(--bg);
      font-size: 13px;
      transition: background 0.1s;
    }

    .student-chip:hover,
    .student-chip.active {
      background: var(--bg2);
      font-weight: 500;
    }

    .student-total-small {
      font-size: 11px;
      color: var(--blue);
      margin-left: 4px;
    }

    .del {
      color: var(--t3);
      font-size: 14px;
      cursor: pointer;
    }

    .del:hover {
      color: #a32d2d;
    }

    .main {
      padding: 1.5rem 2rem 3rem;
      overflow-x: auto;
    }

    /* ── SCREEN REPORT ── */
    .report-header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--br);
    }

    .report-name {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .report-period {
      font-size: 12px;
      color: var(--t3);
      margin-bottom: 4px;
    }

    .report-meta {
      text-align: right;
    }

    .report-rate {
      font-size: 20px;
      font-weight: 600;
    }

    .report-rate-label {
      font-size: 11px;
      color: var(--t3);
    }

    .student-section {
      margin-bottom: 1.5rem;
      background: var(--bg);
      border: 0.5px solid var(--br);
      border-radius: 10px;
      overflow: hidden;
    }

    .student-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg2);
      border-bottom: 0.5px solid var(--br);
      cursor: pointer;
    }

    .student-head-name {
      font-size: 14px;
      font-weight: 600;
    }

    .student-head-subj {
      font-size: 12px;
      color: var(--t2);
      margin-left: 8px;
    }

    .student-head-total {
      font-size: 14px;
      font-weight: 600;
      color: var(--blue);
    }

    .sess-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .sess-table th {
      padding: 8px 12px;
      text-align: left;
      font-weight: 500;
      font-size: 11px;
      color: var(--t3);
      border-bottom: 0.5px solid var(--br);
      letter-spacing: 0.05em;
    }

    .sess-table td {
      padding: 9px 12px;
      border-bottom: 0.5px solid var(--br);
    }

    .sess-table tr:last-child td {
      border-bottom: none;
    }

    .sess-table .total-row td {
      font-weight: 600;
      background: var(--bg2);
    }

    .td-right {
      text-align: right;
    }

    .add-session-row td {
      padding: 6px 12px;
    }

    .sess-input {
      font-family: var(--font);
      font-size: 12px;
      padding: 4px 7px;
      border: 0.5px solid var(--br);
      border-radius: 5px;
      background: var(--bg);
      color: var(--ink);
      outline: none;
    }

    .sess-input:focus {
      border-color: #888;
    }

    .total-section {
      margin-top: 1.5rem;
      padding: 1rem 1.5rem;
      background: var(--ink);
      color: var(--bg);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .total-label {
      font-size: 14px;
      font-weight: 500;
    }

    .total-amount {
      font-size: 24px;
      font-weight: 600;
    }

    .total-sub {
      font-size: 12px;
      opacity: 0.6;
      margin-top: 2px;
    }

    /* ── PRINT (spreadsheet format) ── */
    @media print {
      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      nav,
      .sidebar,
      .add-session-row,
      .btn,
      .no-print {
        display: none !important;
      }

      body {
        background: #fff;
        font-family: Arial, sans-serif;
        font-size: 10pt;
        color: #000;
      }

      .layout {
        display: block;
        max-width: 100%;
      }

      .main {
        padding: 0;
      }

      .report-header {
        display: none;
      }

      /* spreadsheet grid */
      #print-report {
        display: block !important;
      }

      .pr-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 0;
      }

      .pr-table td,
      .pr-table th {
        border: 1px solid #ccc;
        padding: 4px 8px;
        font-size: 9pt;
        vertical-align: middle;
      }

      .pr-header-row td {
        font-weight: bold;
        font-size: 11pt;
        border: none;
        padding: 4px 6px;
      }

      .pr-sub-header td {
        font-size: 9pt;
        border: none;
        padding: 2px 6px;
        color: #555;
      }

      .pr-student-name td {
        background: #e8e8e8;
        font-weight: bold;
        font-size: 10pt;
      }

      .pr-label td:first-child {
        text-align: center;
        color: #555;
      }

      .pr-total-row td {
        font-weight: bold;
        text-align: right;
        border: none;
        font-size: 10pt;
      }

      .pr-grand-total td {
        font-weight: bold;
        font-size: 11pt;
        border: none;
      }

      .pr-spacer td {
        border: none;
        height: 8pt;
      }

      .pr-right {
        text-align: right;
      }

      .pr-center {
        text-align: center;
      }

      /* screen sections hidden during print */
      .student-section,
      .total-section,
      .report-header {
        display: none !important;
      }
    }

    #print-report {
      display: none;
    }
  </style>
</head>

<body>
  <nav>
    <div class="nav-left">
      <a href="./" class="nav-back">← Game</a>
      <span class="nav-title">Payment Report</span>
    </div>
    <div class="nav-right">
      <span data-firebase-sync-status style="font-size:11px;color:var(--t2);">Saved locally</span>
      <button class="btn no-print" onclick="addStudent()">+ Student</button>
      <button class="btn btn-primary no-print" onclick="printReport()">⬇ Download PDF</button>
    </div>
  </nav>

  <div class="layout">
    <div class="sidebar no-print">
      <div>
        <h3>Report Info</h3>
        <div class="field"><label>Tutor name</label><input id="si-name" oninput="saveState();render()"></div>
        <div class="field"><label>Period start</label><input type="date" id="si-start" oninput="saveState();render()"></div>
        <div class="field"><label>Period end</label><input type="date" id="si-end" oninput="saveState();render()"></div>
        <div class="field"><label>Hourly rate ($)</label><input type="number" id="si-rate" min="0" step="0.5"
            oninput="saveState();render()"></div>
        <div class="field"><label>Report every</label><input id="si-every" oninput="saveState();render()"></div>
      </div>
      <div>
        <h3>Students</h3>
        <div class="student-list" id="student-list"></div>
        <button class="btn" style="width:100%;margin-top:8px;" onclick="addStudent()">+ Add student</button>
      </div>
      <div>
        <button class="btn btn-red" style="width:100%;" onclick="clearAll()">Clear all</button>
      </div>
    </div>

    <div class="main">
      <div id="screen-report"></div>
      <!-- Print-only spreadsheet layout -->
      <div id="print-report"></div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="firebase-sync.js"></script>
  <script>
    const KEY = 'payment_v2';
    const SYNC_PAGE = 'payment_report';

    const S = {
      name: 'David Kim', start: '2026-04-26', end: '2026-05-10',
      rate: 40, every: '10th & 25th',
      students: [
        {
          id: 1, name: 'Ian', subject: 'SAT MATH', sessions: [
            { id: 101, date: '2026-05-02', startTime: '10:00', hrs: 2 },
            { id: 102, date: '2026-05-09', startTime: '10:00', hrs: 2 }
          ]
        },
        {
          id: 2, name: 'Siwoo', subject: 'AMC 10 MATH', sessions: [
            { id: 201, date: '2026-04-26', startTime: '12:00', hrs: 1 },
            { id: 202, date: '2026-05-02', startTime: '12:00', hrs: 1 },
            { id: 203, date: '2026-05-09', startTime: '12:00', hrs: 1 }
          ]
        },
        {
          id: 3, name: 'Doyun', subject: 'SAT MATH', sessions: [
            { id: 301, date: '2026-04-26', startTime: '14:00', hrs: 1.5 }
          ]
        }
      ],
      nextId: 10
    };

    function loadState() {
      try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d) Object.assign(S, d); } catch (e) { }
      document.getElementById('si-name').value = S.name || '';
      document.getElementById('si-start').value = S.start || '';
      document.getElementById('si-end').value = S.end || '';
      document.getElementById('si-rate').value = S.rate || 40;
      document.getElementById('si-every').value = S.every || '10th & 25th';
    }
    function saveState() {
      S.name = document.getElementById('si-name').value;
      S.start = document.getElementById('si-start').value;
      S.end = document.getElementById('si-end').value;
      S.rate = parseFloat(document.getElementById('si-rate').value) || 0;
      S.every = document.getElementById('si-every').value;
      localStorage.setItem(KEY, JSON.stringify(S));
      if (window.FirebaseSync?.isConfigured()) FirebaseSync.save(SYNC_PAGE, S).catch(() => { });
    }

    function applyState(d) {
      if (!d) return;
      Object.assign(S, d);
      localStorage.setItem(KEY, JSON.stringify(S));
      document.getElementById('si-name').value = S.name || '';
      document.getElementById('si-start').value = S.start || '';
      document.getElementById('si-end').value = S.end || '';
      document.getElementById('si-rate').value = S.rate || 40;
      document.getElementById('si-every').value = S.every || '10th & 25th';
    }

    function fmt(n) { return '$' + n.toFixed(1); }
    function fmtDate(d) { if (!d) return ''; const p = d.split('-'); return p.length === 3 ? `${+p[1]}/${+p[2]}` : d; }
    function fmtRange(s, e) { const ss = fmtDate(s), ee = fmtDate(e); if (!ss && !ee) return ''; return ss + (ee ? ` – ${ee}` : ''); }
    function fmtTime(t) { if (!t) return ''; const [h, m] = t.split(':'); const hh = +h, mm = +m; return `${hh % 12 || 12}:${mm.toString().padStart(2, '0')} ${hh >= 12 ? 'PM' : 'AM'}`; }

    function stHrs(st) { return st.sessions.reduce((s, x) => s + (parseFloat(x.hrs) || 0), 0); }
    function stTotal(st) { return stHrs(st) * (S.rate || 0); }
    function grandHrs() { return S.students.reduce((s, st) => s + stHrs(st), 0); }
    function grandTotal() { return S.students.reduce((s, st) => s + stTotal(st), 0); }

    function addStudent() {
      const name = prompt('Student name:'); if (!name || !name.trim()) return;
      const subj = prompt('Subject:'); if (!subj) return;
      S.students.push({ id: S.nextId++, name: name.trim(), subject: subj.trim(), sessions: [] });
      saveState(); render();
    }
    function addSession(sid) {
      const st = S.students.find(x => x.id === sid); if (!st) return;
      st.sessions.push({ id: S.nextId++, date: '', startTime: '', hrs: 1 });
      saveState(); render();
    }
    function updSess(sid, id, f, v) {
      const st = S.students.find(x => x.id === sid); if (!st) return;
      const s = st.sessions.find(x => x.id === id); if (!s) return;
      s[f] = f === 'hrs' ? parseFloat(v) || 0 : v;
      saveState(); render();
    }
    function delSess(sid, id) {
      const st = S.students.find(x => x.id === sid); if (!st) return;
      st.sessions = st.sessions.filter(x => x.id !== id); saveState(); render();
    }
    function delStudent(sid) {
      if (!confirm('Remove this student?')) return;
      S.students = S.students.filter(x => x.id !== sid); saveState(); render();
    }
    function clearAll() { if (!confirm('Clear everything?')) return; S.students = []; saveState(); render(); }

    function render() {
      renderSidebar();
      renderScreen();
      renderPrint();
    }

    function renderSidebar() {
      document.getElementById('student-list').innerHTML = S.students.map(st => `
    <div class="student-chip">
      <span>${st.name} <span style="font-size:11px;color:var(--t2);">${st.subject}</span></span>
      <span>
        <span class="student-total-small">${fmt(stTotal(st))}</span>
        <span class="del" onclick="event.stopPropagation();delStudent(${st.id})">✕</span>
      </span>
    </div>`).join('');
    }

    function renderScreen() {
      const rate = S.rate || 0;
      const range = fmtRange(S.start, S.end) || '—';
      let html = `<div class="report-header">
    <div>
      <div class="report-period">Report every ${S.every || '—'}</div>
      <div class="report-name">${S.name || 'Tutor'} <span style="font-weight:300;color:var(--t2);font-size:16px;">(${range})</span></div>
    </div>
    <div class="report-meta">
      <div class="report-rate-label">Rate</div>
      <div class="report-rate">$${rate.toFixed(1)}</div>
    </div>
  </div>`;

      if (!S.students.length) {
        html += `<div style="padding:3rem 0;text-align:center;color:var(--t3);"><div style="font-size:2rem;margin-bottom:1rem;">📋</div><div style="font-size:15px;">No students yet</div></div>`;
      } else {
        S.students.forEach(st => {
          const total = stTotal(st), hrs = stHrs(st);
          html += `<div class="student-section">
        <div class="student-head">
          <div><span class="student-head-name">${st.name}</span><span class="student-head-subj">— ${st.subject}</span></div>
          <span class="student-head-total">${fmt(total)} <span style="font-size:11px;color:var(--t3);font-weight:400;">(${hrs}h × $${rate})</span></span>
        </div>
        <table class="sess-table">
          <thead><tr>
            <th style="width:36px;">#</th>
            <th>Date</th>
            <th>Start</th>
            <th class="td-right">Hours</th>
            <th class="td-right">Amount</th>
            <th class="td-right no-print" style="width:44px;"></th>
          </tr></thead>
          <tbody>
            ${st.sessions.map((s, i) => `<tr>
              <td style="color:var(--t3);">${i + 1}</td>
              <td><input class="sess-input" type="date" value="${s.date}" style="width:120px;" onchange="updSess(${st.id},${s.id},'date',this.value)"></td>
              <td><input class="sess-input" type="time" value="${s.startTime || ''}" style="width:100px;" onchange="updSess(${st.id},${s.id},'startTime',this.value)"></td>
              <td class="td-right"><input class="sess-input" type="number" value="${s.hrs}" min="0" step="0.5" style="width:65px;text-align:right;" onchange="updSess(${st.id},${s.id},'hrs',this.value)"></td>
              <td class="td-right">$${((s.hrs || 0) * rate).toFixed(1)}</td>
              <td class="td-right no-print"><button class="btn btn-red" style="font-size:11px;padding:2px 7px;" onclick="delSess(${st.id},${s.id})">✕</button></td>
            </tr>`).join('')}
            <tr class="add-session-row no-print"><td colspan="6">
              <button class="btn" style="width:100%;font-size:12px;" onclick="addSession(${st.id})">+ Add session</button>
            </td></tr>
            <tr class="total-row">
              <td colspan="3" style="font-size:12px;color:var(--t2);">Total</td>
              <td class="td-right">${hrs}h</td>
              <td class="td-right">${fmt(total)}</td>
              <td class="no-print"></td>
            </tr>
          </tbody>
        </table>
      </div>`;
        });

        const gt = grandTotal(), gh = grandHrs();
        html += `<div class="total-section">
      <div><div class="total-label">Total</div><div class="total-sub">${gh}h × $${rate}/hr · ${S.students.length} student${S.students.length !== 1 ? 's' : ''}</div></div>
      <div class="total-amount">${fmt(gt)}</div>
    </div>`;
      }
      document.getElementById('screen-report').innerHTML = html;
    }

    function renderPrint() {
      // Spreadsheet-style print layout matching the reference format
      const rate = S.rate || 0;
      const MAX_DATES = 8; // max session columns

      let rows = '';

      // Header rows
      rows += `<tr class="pr-header-row"><td colspan="${MAX_DATES + 3}">Report every ${S.every || '—'}</td></tr>`;
      rows += `<tr class="pr-header-row"><td colspan="${Math.ceil((MAX_DATES + 3) / 2)}" style="font-size:13pt;">${S.name || 'Tutor'} (${fmtDate(S.start) || '?'}-${fmtDate(S.end) || '?'})</td><td colspan="${Math.floor((MAX_DATES + 3) / 2) - 2}"></td><td style="text-align:right;font-size:9pt;color:#555;">Rate</td><td style="text-align:right;font-weight:bold;">${rate.toFixed(1)}</td></tr>`;
      rows += `<tr class="pr-spacer"><td colspan="${MAX_DATES + 3}"></td></tr>`;

      S.students.forEach((st, si) => {
        const hrs = stHrs(st), total = stTotal(st);
        // Student name row
        rows += `<tr class="pr-student-name"><td colspan="${MAX_DATES + 3}">${st.name} – ${st.subject}</td></tr>`;

        // Day row
        rows += `<tr class="pr-label"><td>Day</td>`;
        st.sessions.forEach(s => { rows += `<td class="pr-center">${fmtDate(s.date)}</td>`; });
        for (let i = st.sessions.length; i < MAX_DATES; i++) rows += `<td></td>`;
        rows += `<td></td><td class="pr-right" style="font-size:9pt;color:#555;">Total</td></tr>`;

        // Start time row
        rows += `<tr class="pr-label"><td>Start</td>`;
        st.sessions.forEach(s => { rows += `<td class="pr-center">${fmtTime(s.startTime) || '—'}</td>`; });
        for (let i = st.sessions.length; i < MAX_DATES; i++) rows += `<td></td>`;
        rows += `<td colspan="2"></td></tr>`;

        // Hours row
        rows += `<tr class="pr-label"><td>Hours</td>`;
        st.sessions.forEach(s => { rows += `<td class="pr-center">${s.hrs}</td>`; });
        for (let i = st.sessions.length; i < MAX_DATES; i++) rows += `<td></td>`;
        rows += `<td></td><td class="pr-right">${total.toFixed(1)}</td></tr>`;

        rows += `<tr class="pr-spacer"><td colspan="${MAX_DATES + 3}"></td></tr>`;
      });

      // Grand total row
      const gt = grandTotal();
      rows += `<tr class="pr-grand-total">`;
      for (let i = 0; i < MAX_DATES + 1; i++) rows += `<td style="border:none;"></td>`;
      rows += `<td style="text-align:right;font-weight:bold;border:none;text-decoration:underline;">Total</td>`;
      rows += `<td style="text-align:right;font-weight:bold;border:none;text-decoration:underline;">${gt.toFixed(1)}</td></tr>`;

      document.getElementById('print-report').innerHTML = `<table class="pr-table">${rows}</table>`;
    }

    function printReport() {
      renderPrint();
      window.print();
    }

    loadState(); render();
    (async function initSync() {
      if (!window.FirebaseSync?.isConfigured()) return;
      try {
        const cloud = await FirebaseSync.load(SYNC_PAGE);
        if (cloud) {
          applyState(cloud);
          render();
        } else {
          await FirebaseSync.save(SYNC_PAGE, S);
        }
        FirebaseSync.subscribe(SYNC_PAGE, data => {
          applyState(data);
          render();
        });
      } catch (e) {
        console.warn('Payment Firebase sync failed:', e);
      }
    })();
  </script>
</body>

</html>
