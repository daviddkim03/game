<!DOCTYPE html>
<html lang="en">

<head>
  <base href="../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GAME Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-sync.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg1: #fff;
      --bg2: #f4f3ef;
      --bg3: #eceae4;
      --bgi: #e6f1fb;
      --bgw: #faeeda;
      --bgd: #fcebeb;
      --t1: #1a1a18;
      --t2: #5f5e5a;
      --t3: #aaa9a3;
      --ti: #185fa5;
      --tw: #854f0b;
      --td: #a32d2d;
      --br: rgba(0, 0, 0, 0.12);
      --brw: #ba7517;
      --rmd: 8px;
      --rlg: 12px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    @media(prefers-color-scheme:dark) {
      :root {
        --bg1: #1e1e1c;
        --bg2: #2c2c2a;
        --bg3: #333331;
        --bgi: #042c53;
        --bgw: #412402;
        --bgd: #501313;
        --t1: #f0efe9;
        --t2: #b4b2a9;
        --t3: #6e6d69;
        --ti: #85b7eb;
        --tw: #ef9f27;
        --td: #f09595;
        --br: rgba(255, 255, 255, 0.12);
        --brw: #ef9f27;
      }
    }

    body {
      font-family: var(--font);
      background: var(--bg3);
      color: var(--t1);
      min-height: 100vh;
    }

    #app {
      max-width: 820px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 4rem;
    }

    button {
      font-family: var(--font);
      cursor: pointer;
      background: none;
      border: 0.5px solid var(--br);
      border-radius: var(--rmd);
      color: var(--t1);
      padding: 6px 12px;
      font-size: 13px;
    }

    button:hover {
      background: var(--bg2);
    }

    input,
    select {
      font-family: var(--font);
      font-size: 13px;
      background: var(--bg1);
      color: var(--t1);
      border: 0.5px solid rgba(128, 128, 128, 0.4);
      border-radius: var(--rmd);
      padding: 4px 8px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--ti);
    }

    input:disabled {
      opacity: 0.5;
      cursor: default;
    }

    table {
      border-collapse: collapse;
    }

    .tog-btn {
      transition: background 0.12s, color 0.12s;
    }

    #toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      background: var(--t1);
      color: var(--bg1);
      font-size: 12px;
      padding: 7px 13px;
      border-radius: var(--rmd);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 999;
    }

    .cal-pill {
      touch-action: none;
      pointer-events: auto;
      -webkit-user-select: none;
      user-select: none;
    }

    #toast.show {
      opacity: 1;
    }
  </style>
  <script>document.documentElement.classList.add("firebase-auth-pending");</script>
  <style>
    html.firebase-auth-pending body > :not(#firebase-auth-panel):not(#firebase-auth-bar) {
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="root"></div>
  </div>
  <div id="toast">Saved</div>
  <div data-firebase-sync-status style="position:fixed;right:16px;bottom:16px;font-size:11px;color:var(--t2);z-index:999;">Saved locally</div>
  <script>
    /* ══ CONSTANTS ═══════════════════════════════════════════ */
    const INC_COLORS = ['#639922', '#378ADD', '#7F77DD', '#D85A30', '#1abc9c', '#e67e22', '#e91e8c'];
    const COLOR_POOL = ['#E24B4A', '#ea9f27', '#1abc9c', '#e91e8c', '#00bcd4', '#8bc34a', '#ff5722'];
    const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const DAYS_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    /* ══ DEFAULTS ════════════════════════════════════════════ */
    const D = {
      taxRate: 0.25,
      income: [
        { id: 1, name: 'Young', type: 'Taxed', payType: 'Salary', monthly: 5000, rate: null, hrsPerWeek: null, paydayType: 'dates', paydayDates: [1, 16], paydayWeekdays: [], showOnCal: true },
        { id: 2, name: 'Steven', type: 'Taxed', payType: 'Hourly', monthly: null, rate: 40, hrsPerWeek: 4, paydayType: 'dates', paydayDates: [15, 31], paydayWeekdays: [], showOnCal: true },
        { id: 3, name: 'Prime', type: 'Taxed', payType: 'Hourly', monthly: null, rate: 40, hrsPerWeek: 4, paydayType: 'dates', paydayDates: [20, 5], paydayWeekdays: [], showOnCal: true },
        { id: 4, name: 'Twins', type: 'Untaxed', payType: 'Hourly', monthly: null, rate: 40, hrsPerWeek: 4, paydayType: 'dates', paydayDates: [], paydayWeekdays: [], showOnCal: true }
      ],
      categories: ['Loans', 'Necessities', 'Luxury', 'Fuckery'],
      catColors: { Loans: '#378ADD', Necessities: '#1D9E75', Luxury: '#7F77DD', Fuckery: '#D85A30' },
      expenses: [
        { id: 1, name: 'Rent', cat: 'Necessities', cost: 700, due: 1, showOnCal: true },
        { id: 2, name: 'Groceries', cat: 'Necessities', cost: 250, due: null, showOnCal: true },
        { id: 3, name: 'Gas', cat: 'Necessities', cost: 100, due: null, showOnCal: true },
        { id: 4, name: 'Haircut', cat: 'Necessities', cost: 35, due: null, showOnCal: true },
        { id: 5, name: 'Auto', cat: 'Loans', cost: 202, due: 12, showOnCal: true },
        { id: 6, name: 'Auto Ins', cat: 'Loans', cost: 200, due: 2, showOnCal: true },
        { id: 7, name: 'Student', cat: 'Loans', cost: 100, due: 3, showOnCal: true },
        { id: 8, name: 'Health', cat: 'Loans', cost: 126, due: 2, showOnCal: true },
        { id: 9, name: 'Gym', cat: 'Luxury', cost: 20, due: null, showOnCal: true },
        { id: 10, name: 'Spotify', cat: 'Luxury', cost: 22, due: null, showOnCal: true },
        { id: 11, name: 'iCloud', cat: 'Luxury', cost: 1, due: null, showOnCal: true },
        { id: 12, name: 'AI', cat: 'Luxury', cost: 28, due: null, showOnCal: true },
        { id: 13, name: 'Lottery', cat: 'Fuckery', cost: 8, due: null, showOnCal: true },
        { id: 14, name: 'Misc (untracked)', cat: 'Fuckery', cost: 200, due: null, showOnCal: true }
      ],
      nextId: 20
    };

    /* ══ STORAGE ═════════════════════════════════════════════ */
    const KEY = 'game_tracker_v3';
    const SYNC_PAGE = 'game_tracker';
    const HAD_LOCAL_STATE = !!localStorage.getItem(KEY);
    function statePayload() {
      return { taxRate: S.taxRate, income: S.income, categories: S.categories, catColors: S.catColors, expenses: S.expenses, nextId: S.nextId, tabOrder: S.tabOrder };
    }
    function applyState(d) {
      const sv = migrate(d);
      if (!sv) return;
      S.taxRate = sv.taxRate;
      S.income = sv.income;
      S.categories = sv.categories;
      S.catColors = sv.catColors;
      S.expenses = sv.expenses;
      S.nextId = sv.nextId;
      S.tabOrder = sv.tabOrder || S.tabOrder;
    }
    function loadSaved() { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
    function saveState() {
      try {
        const data = statePayload();
        localStorage.setItem(KEY, JSON.stringify(data));
        if (window.FirebaseSync?.isConfigured()) FirebaseSync.save(SYNC_PAGE, data).catch(() => showToast('Cloud save failed'));
        showToast(window.FirebaseSync?.isConfigured() ? 'Saved + synced' : 'Saved locally');
      }
      catch (e) { showToast('Save failed'); }
    }
    let _tt = null;
    function showToast(m) { const el = document.getElementById('toast'); if (!el) return; el.textContent = m; el.classList.add('show'); clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), 1600); }

    /* ══ MIGRATE ═════════════════════════════════════════════ */
    function migrate(sv) {
      if (!sv) return null;
      if (sv.income) sv.income = sv.income.map(s => {
        if (!s.paydayType) { const ns = s.payday ? s.payday.match(/\d+/g) : []; s.paydayType = 'dates'; s.paydayDates = ns ? ns.map(Number) : []; s.paydayWeekdays = []; }
        if (s.showOnCal === undefined) s.showOnCal = true;
        if (!s.payType) s.payType = (s.rate && !s.monthly) ? 'Hourly' : 'Salary';
        s.hrsPerWeek = s.hrsPerWeek || null; delete s.guar; return s;
      });
      if (sv.expenses) sv.expenses = sv.expenses.map(e => { if (e.showOnCal === undefined) e.showOnCal = true; return e; });
      if (!sv.categories) sv.categories = [...D.categories];
      if (!sv.catColors) sv.catColors = { ...D.catColors };
      return sv;
    }

    /* ══ STATE ═══════════════════════════════════════════════ */
    const _now = new Date();
    const sv = migrate(loadSaved());
    const S = {
      taxRate: sv ? sv.taxRate : D.taxRate,
      income: sv ? sv.income : JSON.parse(JSON.stringify(D.income)),
      categories: sv ? sv.categories : [...D.categories],
      catColors: sv ? sv.catColors : { ...D.catColors },
      expenses: sv ? sv.expenses : JSON.parse(JSON.stringify(D.expenses)),
      nextId: sv ? sv.nextId : D.nextId,
      tab: 'dashboard', editing: null,
      tabOrder: sv && sv.tabOrder ? sv.tabOrder : ['dashboard', 'income', 'expenses', 'calendar'],
      calYear: _now.getFullYear(), calMonth: _now.getMonth(),
      calShowPaydays: true, calShowBills: true
    };

    /* ══ HELPERS ═════════════════════════════════════════════ */
    function eMo(src) { return src.payType === 'Hourly' ? (src.rate || 0) * (src.hrsPerWeek || 0) * 4 : (src.monthly || 0); }
    function fmt(n) { return '$' + Math.round(n).toLocaleString(); }
    function pct(n) { return Math.round(n) + '%'; }
    function ord(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return s[(v - 20) % 10] || s[v] || s[0]; }
    function cc(cat) { return S.catColors[cat] || '#888780'; }
    function ic(idx) { return INC_COLORS[idx % INC_COLORS.length]; }

    /* ══ CALC ════════════════════════════════════════════════ */
    function calc() {
      const gross = S.income.reduce((s, i) => s + eMo(i), 0);
      const taxed = S.income.filter(i => i.type === 'Taxed').reduce((s, i) => s + eMo(i), 0);
      const untaxed = S.income.filter(i => i.type === 'Untaxed').reduce((s, i) => s + eMo(i), 0);
      const earn = taxed * (1 - S.taxRate) + untaxed;

      // Bonus: annual only, NOT in monthly GAME
      const bonTaxed = S.income.filter(i => i.payType === 'Salary' && i.type === 'Taxed' && i.rate).reduce((s, i) => s + (i.rate || 0), 0);
      const bonUntaxed = S.income.filter(i => i.payType === 'Salary' && i.type === 'Untaxed' && i.rate).reduce((s, i) => s + (i.rate || 0), 0);
      const annBonus = bonTaxed + bonUntaxed;
      const annBonusNet = bonTaxed * (1 - S.taxRate) + bonUntaxed;

      const annGross = gross * 12 + annBonus;
      const afterTax = earn * 12 + annBonusNet;
      const exp = S.expenses.filter(e => e.cat !== 'Uncategorized').reduce((s, e) => s + e.cost, 0);
      const pureSav = afterTax - exp * 12;
      const game = earn - exp;
      const byCat = {}; S.expenses.forEach(e => { if (e.cat !== 'Uncategorized') byCat[e.cat] = (byCat[e.cat] || 0) + e.cost; });
      return { gross, taxed, untaxed, earn, annBonus, annBonusNet, annGross, afterTax, exp, pureSav, game, byCat, chk: exp * 2, emg: exp * 6 };
    }

    /* ══ RENDER ══════════════════════════════════════════════ */
    let donutC = null, barC = null;
    function render() {
      const C = calc();
      document.getElementById('root').innerHTML = app(C);
      if (S.tab === 'dashboard') setTimeout(() => charts(C), 0);
    }

    // ── Calendar pill drag — inline onmousedown="pillGrab(...)" on each pill ──
    var _pg = { ghost: null, kind: null, refId: 0, fromDay: 0, moved: false, lastCell: null, active: false, bg: null, isWeekday: false };

    function pillGrab(e, el, kind, refId, fromDay, isWeekday) {
      e.preventDefault();
      e.stopPropagation();
      _pg.active = true; _pg.moved = false; _pg.lastCell = null;
      _pg.kind = kind; _pg.refId = +refId; _pg.fromDay = +fromDay; _pg.isWeekday = !!isWeekday;
      _pg.bg = el.style.background || '#639922';
      var label = el.textContent || kind;
      var g = document.createElement('div');
      g.style.cssText = 'position:fixed;pointer-events:none;z-index:9999;'
        + 'padding:4px 10px;border-radius:4px;white-space:nowrap;'
        + 'background:' + _pg.bg + ';color:#fff;font-size:12px;font-weight:700;'
        + 'box-shadow:0 4px 20px rgba(0,0,0,.55);transition:none;'
        + 'left:' + (e.clientX + 14) + 'px;top:' + (e.clientY - 14) + 'px;';
      g.textContent = label.trim();
      document.body.appendChild(g);
      _pg.ghost = g;
    }

    document.addEventListener('mousemove', function (e) {
      if (!_pg.active || !_pg.ghost) return;
      _pg.moved = true;
      _pg.ghost.style.left = (e.clientX + 14) + 'px';
      _pg.ghost.style.top = (e.clientY - 14) + 'px';
      _pg.ghost.style.display = 'none';
      var under = document.elementFromPoint(e.clientX, e.clientY);
      _pg.ghost.style.display = '';
      document.querySelectorAll('td[data-cal-day]').forEach(function (td) { td.style.outline = ''; });
      _pg.lastCell = under ? under.closest('td[data-cal-day]') : null;
      if (_pg.lastCell) _pg.lastCell.style.outline = '2px solid #639922';
    });

    document.addEventListener('mouseup', function (e) {
      if (!_pg.active) return;
      if (_pg.ghost) { _pg.ghost.remove(); _pg.ghost = null; }
      _pg.active = false;
      document.querySelectorAll('td[data-cal-day]').forEach(function (td) { td.style.outline = ''; });
      if (!_pg.moved || !_pg.lastCell) return;
      var d = +_pg.lastCell.dataset.calDay;
      if (d === _pg.fromDay) return;
      var kind = _pg.kind, refId = _pg.refId, fromDay = _pg.fromDay;
      if (kind === 'bill') {
        var exp = S.expenses.find(function (x) { return x.id === refId; });
        if (exp) { exp.due = d; saveState(); render(); }
      } else if (kind === 'pay') {
        var src = S.income.find(function (x) { return x.id === refId; });
        if (!src) return;
        if (_pg.isWeekday && src.paydayType === 'weekdays') {
          // fromDay is old DOW, compute new DOW from drop target
          var tgtDow = new Date(S.calYear, S.calMonth, d).getDay();
          var wi = src.paydayWeekdays.indexOf(fromDay);
          if (wi >= 0) src.paydayWeekdays.splice(wi, 1);
          if (!src.paydayWeekdays.includes(tgtDow)) src.paydayWeekdays.push(tgtDow);
          saveState(); render();
        } else if (src.paydayType === 'dates') {
          var i = src.paydayDates.indexOf(fromDay);
          if (i >= 0) src.paydayDates.splice(i, 1);
          if (!src.paydayDates.includes(d)) src.paydayDates.push(d);
          src.paydayDates.sort(function (a, b) { return a - b; });
          saveState(); render();
        }
      }
    });

    function app(C) {
      const tabs = ['dashboard', 'income', 'expenses', 'calendar'];
      return `<div>
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1.25rem;">
    <div style="display:flex;align-items:baseline;gap:1rem;">
      <a href="./" style="font-size:13px;color:var(--t2);text-decoration:none;">&larr; Game</a>
      <span style="font-size:20px;font-weight:500;letter-spacing:-0.3px;">GAME Tracker</span>
    </div>
    <span style="font-size:12px;color:var(--t2);">${MONTHS[new Date().getMonth()]} ${new Date().getFullYear()}</span>
  </div>
  <div style="display:flex;border-bottom:0.5px solid var(--br);margin-bottom:1.5rem;">
    ${tabs.map(t => `<button onclick="setTab('${t}')" style="border:none;border-bottom:2px solid ${S.tab === t ? 'var(--t1)' : 'transparent'};border-radius:0;color:${S.tab === t ? 'var(--t1)' : 'var(--t2)'};padding:8px 16px;font-weight:${S.tab === t ? '500' : '400'};">${t.charAt(0).toUpperCase() + t.slice(1)}</button>`).join('')}
  </div>
  ${S.tab === 'dashboard' ? dash(C) : ''}
  ${S.tab === 'income' ? income(C) : ''}
  ${S.tab === 'expenses' ? expenses(C) : ''}
  ${S.tab === 'calendar' ? calTab() : ''}
  </div>`;
    }

    /* ══ DASHBOARD ═══════════════════════════════════════════ */
    function mc(l, v, s, col) { return `<div style="background:var(--bg2);border-radius:var(--rmd);padding:0.875rem 1rem;"><div style="font-size:11px;color:var(--t2);margin-bottom:4px;">${l}</div><div style="font-size:20px;font-weight:500;color:${col || 'var(--t1)'};line-height:1.15;">${v}</div>${s ? `<div style="font-size:11px;color:var(--t2);margin-top:3px;">${s}</div>` : ''}</div>`; }
    function dash(C) {
      const gc = C.game >= 0 ? '#639922' : '#E24B4A', sr = C.earn > 0 ? Math.round(C.game / C.earn * 100) : 0;
      const mCk = C.game > 0 ? Math.ceil(C.chk / C.game) : null, mEm = C.game > 0 ? Math.ceil(C.emg / C.game) : null;
      return `
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.25rem;">
    ${mc('Monthly gross', fmt(C.gross), `Taxed ${fmt(C.taxed)} · Untaxed ${fmt(C.untaxed)}`)}
    ${mc('Take-home', fmt(C.earn), `After ${pct(S.taxRate * 100)} tax on taxed`)}
    ${mc('Monthly expenses', fmt(C.exp), `${S.expenses.filter(e => e.cat !== 'Uncategorized').length} items`)}
    ${mc('GAME', fmt(C.game), `${sr}% of take-home saved`, gc)}
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.25rem;">
    <div style="background:var(--bg1);border:0.5px solid var(--br);border-radius:var(--rlg);padding:1rem;">
      <div style="font-size:11px;font-weight:500;color:var(--t2);margin-bottom:10px;">Where your take-home goes</div>
      <div style="position:relative;height:165px;"><canvas id="c-donut" role="img" aria-label="Expense breakdown donut"></canvas></div>
      <div id="donut-leg" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;"></div>
    </div>
    <div style="background:var(--bg1);border:0.5px solid var(--br);border-radius:var(--rlg);padding:1rem;">
      <div style="font-size:11px;font-weight:500;color:var(--t2);margin-bottom:10px;">Gross vs take-home vs GAME</div>
      <div style="position:relative;height:165px;"><canvas id="c-bar" role="img" aria-label="Income comparison bar chart"></canvas></div>
    </div>
  </div>
  <div style="background:var(--bg1);border:0.5px solid var(--br);border-radius:var(--rlg);padding:1rem 1.25rem;margin-bottom:1.25rem;">
    <div style="font-size:11px;font-weight:500;color:var(--t2);margin-bottom:14px;">GAME — savings breakdown</div>
    <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:10px;">
      <span style="font-size:28px;font-weight:500;color:${gc};">${fmt(C.game)}</span>
      <span style="font-size:13px;color:var(--t2);">saved each month</span>
      ${C.annBonus ? `<span style="font-size:12px;color:var(--t2);margin-left:4px;">+ ${fmt(C.annBonus)} bonus at year end</span>` : ''}
    </div>
    <div style="background:var(--bg2);border-radius:6px;overflow:hidden;height:8px;margin-bottom:16px;">
      <div style="height:100%;width:${Math.max(0, Math.min(100, sr))}%;background:${gc};"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;">
      ${[['Gross income', fmt(C.gross), '100% of gross'], ['Take-home', fmt(C.earn), pct(Math.round(C.earn / C.gross * 100)) + ' of gross'], ['Expenses', fmt(C.exp), pct(Math.round(C.exp / C.earn * 100)) + ' of take-home'], ['GAME', fmt(C.game), pct(sr) + ' of take-home'], ['Annual savings', fmt(Math.max(0, C.game) * 12), 'projected'], ['Pure savings/yr', fmt(C.pureSav), 'after-tax − expenses']].map(([l, v, s]) => `<div style="text-align:center;padding:10px 8px;background:var(--bg2);border-radius:var(--rmd);"><div style="font-size:11px;color:var(--t2);margin-bottom:4px;">${l}</div><div style="font-size:14px;font-weight:500;">${v}</div><div style="font-size:11px;color:var(--t2);">${s}</div></div>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--t2);padding-top:10px;border-top:0.5px solid var(--br);">
      Checking (2×): <strong style="color:var(--t1);font-weight:500;">${fmt(C.chk)}</strong>
      &nbsp;·&nbsp; Emergency (6×): <strong style="color:var(--t1);font-weight:500;">${fmt(C.emg)}</strong>
      &nbsp;·&nbsp; Months to checking: <strong style="color:var(--t1);font-weight:500;">${mCk || '—'}</strong>
      &nbsp;·&nbsp; To emergency: <strong style="color:var(--t1);font-weight:500;">${mEm || '—'}</strong>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
    <div style="background:var(--bg1);border:0.5px solid var(--br);border-radius:var(--rlg);padding:1rem 1.25rem;">
      <div style="font-size:11px;font-weight:500;color:var(--t2);margin-bottom:12px;">Annual summary</div>
      ${[['Annual gross (incl. bonus)', fmt(C.annGross)], ['Annual after-tax', fmt(C.afterTax)], ['Annual bonus (net)', fmt(C.annBonusNet)], ['Pure savings', fmt(C.pureSav)], ['Tax paid', fmt(C.annGross - C.afterTax)]].map(([l, v]) => `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:0.5px solid var(--br);"><span style="font-size:13px;color:var(--t2);">${l}</span><span style="font-size:13px;font-weight:500;">${v}</span></div>`).join('')}
    </div>
    <div style="background:var(--bg1);border:0.5px solid var(--br);border-radius:var(--rlg);padding:1rem 1.25rem;">
      <div style="font-size:11px;font-weight:500;color:var(--t2);margin-bottom:12px;">Settings</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <label style="font-size:13px;color:var(--t2);">Tax rate</label>
        <input type="number" value="${Math.round(S.taxRate * 100)}" min="0" max="99" style="width:55px;text-align:center;" onchange="setTax(+this.value)">
        <span style="font-size:13px;color:var(--t2);">% on taxed income</span>
      </div>
      <div style="font-size:12px;color:var(--t2);">Take-home: <strong style="color:var(--t1);font-weight:500;">${fmt(C.earn)}</strong>/mo</div>
      <div style="margin-top:12px;font-size:11px;color:var(--t3);">Saves locally and syncs to Firebase when configured.</div>
    </div>
  </div>`;
    }

    /* ══ INCOME ══════════════════════════════════════════════ */
    function income(C) {
      return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
  <span style="font-size:13px;color:var(--t2);">Gross <strong style="font-weight:500;color:var(--t1);">${fmt(C.gross)}</strong> · Take-home <strong style="font-weight:500;color:var(--t1);">${fmt(C.earn)}</strong></span>
  <button onclick="addInc()">+ Add source</button>
  </div>
  <div style="background:var(--bg1);border:0.5px solid var(--br);border-radius:var(--rlg);overflow:hidden;">
  <table style="width:100%;font-size:13px;table-layout:fixed;">
    <thead><tr style="border-bottom:0.5px solid var(--br);">
      <th style="width:4%;padding:10px 0 10px 10px;"></th>
      <th style="padding:10px 8px;text-align:left;font-weight:500;color:var(--t2);width:19%;">Source</th>
      <th style="padding:10px 8px;text-align:left;font-weight:500;color:var(--t2);width:13%;">Type</th>
      <th style="padding:10px 8px;text-align:left;font-weight:500;color:var(--t2);width:13%;">Pay</th>
      <th style="padding:10px 8px;text-align:left;font-weight:500;color:var(--t2);width:22%;">Rate / Hrs</th>
      <th style="padding:10px 8px;text-align:left;font-weight:500;color:var(--t2);width:17%;">Payday</th>
      <th style="padding:10px 8px;text-align:right;font-weight:500;color:var(--t2);width:12%;">Monthly</th>
    </tr></thead>
    <tbody>${S.income.map((s, i) => incRow(s, i)).join('')}</tbody>
    <tfoot><tr style="border-top:0.5px solid var(--br);background:var(--bg2);">
      <td colspan="6" style="padding:9px 12px;font-size:12px;color:var(--t2);">Total gross / take-home</td>
      <td style="padding:9px 12px;text-align:right;font-weight:500;">${fmt(C.gross)}<br><span style="font-size:11px;color:var(--t2);">${fmt(C.earn)}</span></td>
    </tr></tfoot>
  </table></div>
  <p style="margin-top:8px;font-size:11px;color:var(--t2);">Click to edit · ⠿ drag to reorder · ● toggles calendar display</p>`;
    }

    function incRow(s, idx) {
      const mo = eMo(s), net = s.type === 'Taxed' ? mo * (1 - S.taxRate) : mo;
      const calOn = s.showOnCal !== false, col = ic(idx);

      if (S.editing === 'inc-' + s.id) {
        const isH = s.payType === 'Hourly';
        return `<tr style="background:var(--bg2);">
    <td colspan="7" style="padding:12px 14px;">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;">
        <div><div style="font-size:11px;color:var(--t2);margin-bottom:3px;">Name</div><input value="${s.name}" onchange="ui(${s.id},'name',this.value)" style="width:100%;"></div>
        <div><div style="font-size:11px;color:var(--t2);margin-bottom:3px;">Tax type</div>
          <select onchange="ui(${s.id},'type',this.value)" style="width:100%;">
            <option ${s.type === 'Taxed' ? 'selected' : ''}>Taxed</option>
            <option ${s.type === 'Untaxed' ? 'selected' : ''}>Untaxed</option>
          </select></div>
        <div><div style="font-size:11px;color:var(--t2);margin-bottom:3px;">Pay structure</div>
          <select onchange="ui(${s.id},'payType',this.value);render()" style="width:100%;">
            <option ${s.payType === 'Salary' ? 'selected' : ''}>Salary</option>
            <option ${s.payType === 'Hourly' ? 'selected' : ''}>Hourly</option>
          </select></div>
      </div>
      ${isH ? `
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;">
        <div><div style="font-size:11px;color:var(--t2);margin-bottom:3px;">Rate ($/hr)</div><input type="number" value="${s.rate || ''}" onchange="ui(${s.id},'rate',+this.value);render()" style="width:100%;"></div>
        <div><div style="font-size:11px;color:var(--t2);margin-bottom:3px;">Hours/week</div><input type="number" value="${s.hrsPerWeek || ''}" onchange="ui(${s.id},'hrsPerWeek',+this.value);render()" style="width:100%;"></div>
        <div><div style="font-size:11px;color:var(--t2);margin-bottom:3px;">Monthly (computed)</div><input value="${fmt(mo)}" disabled style="width:100%;"></div>
      </div>`: `
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;">
        <div><div style="font-size:11px;color:var(--t2);margin-bottom:3px;">Monthly salary</div><input type="number" value="${s.monthly || ''}" onchange="ui(${s.id},'monthly',+this.value)" style="width:100%;"></div>
        <div><div style="font-size:11px;color:var(--t2);margin-bottom:3px;">Annual bonus (optional)</div><input type="number" value="${s.rate || ''}" placeholder="0" onchange="ui(${s.id},'rate',this.value?+this.value:null)" style="width:100%;"></div>
        <div style="display:flex;flex-direction:column;justify-content:flex-end;"><div style="font-size:11px;color:var(--t2);">Bonus shows in annual summary only — not counted in monthly GAME.</div></div>
      </div>`}
      <div style="margin-bottom:10px;">
        <div style="font-size:11px;color:var(--t2);margin-bottom:6px;">Payday type</div>
        <div style="display:flex;gap:6px;margin-bottom:8px;">
          <button class="tog-btn" onclick="ui(${s.id},'paydayType','dates');render()" style="font-size:12px;padding:4px 12px;background:${s.paydayType === 'dates' ? 'var(--t1)' : 'none'};color:${s.paydayType === 'dates' ? 'var(--bg1)' : 'var(--t1)'};">Specific dates</button>
          <button class="tog-btn" onclick="ui(${s.id},'paydayType','weekdays');render()" style="font-size:12px;padding:4px 12px;background:${s.paydayType === 'weekdays' ? 'var(--t1)' : 'none'};color:${s.paydayType === 'weekdays' ? 'var(--bg1)' : 'var(--t1)'};">Days of week</button>
        </div>
        ${s.paydayType === 'weekdays' ? `
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${DAYS_SHORT.map((d, i) => { const on = (s.paydayWeekdays || []).includes(i); return `<button onclick="togWD(${s.id},${i})" style="padding:5px 10px;font-size:12px;background:${on ? col : 'none'};color:${on ? '#fff' : 'var(--t1)'};border-color:${on ? col : 'var(--br)'};">${d}</button>`; }).join('')}
        </div>`: `
        <div style="display:flex;flex-wrap:wrap;gap:4px;">
          ${Array.from({ length: 31 }, (_, i) => { const d = i + 1, on = (s.paydayDates || []).includes(d); return `<button onclick="togPD(${s.id},${d})" style="padding:3px 7px;min-width:32px;font-size:11px;background:${on ? col : 'none'};color:${on ? '#fff' : 'var(--t1)'};border-color:${on ? col : 'var(--br)'};">${d}</button>`; }).join('')}
        </div>`}
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button onclick="snd()" style="padding:5px 16px;font-weight:500;">✓ Save</button>
        <button onclick="delInc(${s.id})" style="padding:5px 12px;color:var(--td);">Delete</button>
      </div>
    </td></tr>`;
      }

      const pdLabel = s.paydayType === 'weekdays'
        ? (s.paydayWeekdays || []).map(i => DAYS_SHORT[i]).join(', ') || '—'
        : (s.paydayDates || []).map(d => d + ord(d)).join(', ') || '—';
      const rateInfo = s.payType === 'Hourly'
        ? `${fmt(s.rate || 0)}/hr × ${s.hrsPerWeek || 0}h/wk`
        : (s.rate ? `Bonus ${fmt(s.rate)}/yr` : '—');

      return `<tr data-inc-id="${s.id}" draggable="true"
    ondragstart="iDS(event,${s.id})" ondragover="iDO(event,${s.id})" ondragleave="iDL(${s.id})"
    ondrop="iDP(event,${s.id})" ondragend="iDE(${s.id})"
    style="border-bottom:0.5px solid var(--br);">
  <td style="padding:10px 4px 10px 10px;color:var(--t3);font-size:15px;cursor:grab;user-select:none;" onclick="event.stopPropagation()">⠿</td>
  <td style="padding:10px 8px;cursor:pointer;" onclick="if(!dragging)edit('inc-${s.id}')">${s.name}</td>
  <td style="padding:10px 8px;cursor:pointer;" onclick="if(!dragging)edit('inc-${s.id}')">
    <span style="font-size:11px;padding:2px 7px;border-radius:20px;background:${s.type === 'Taxed' ? 'var(--bgi)' : 'var(--bgw)'};color:${s.type === 'Taxed' ? 'var(--ti)' : 'var(--tw)'};">${s.type}</span>
  </td>
  <td style="padding:10px 8px;cursor:pointer;" onclick="if(!dragging)edit('inc-${s.id}')">
    <span style="font-size:11px;padding:2px 7px;border-radius:20px;background:var(--bg2);color:var(--t2);">${s.payType}</span>
  </td>
  <td style="padding:10px 8px;font-size:12px;color:var(--t2);cursor:pointer;" onclick="if(!dragging)edit('inc-${s.id}')">${rateInfo}</td>
  <td style="padding:10px 8px;font-size:12px;color:var(--t2);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" onclick="if(!dragging)edit('inc-${s.id}')">${pdLabel}</td>
  <td style="padding:10px 8px 10px 4px;text-align:right;cursor:pointer;" onclick="if(!dragging)edit('inc-${s.id}')">
    <div style="font-weight:500;color:#639922;">${fmt(mo)}</div>
    <div style="font-size:11px;color:var(--t2);">${fmt(net)}</div>
    <span onclick="event.stopPropagation();togIncCal(${s.id})" style="font-size:14px;cursor:pointer;color:${calOn ? col : 'var(--t3)'};display:block;line-height:1.3;" title="${calOn ? 'On calendar' : 'Hidden from calendar'}">●</span>
  </td>
  </tr>`;
    }

    /* ══ EXPENSES ════════════════════════════════════════════ */
    function expenses(C) {
      const uncat = S.expenses.filter(e => e.cat === 'Uncategorized');
      return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
    <span style="font-size:13px;color:var(--t2);">Total <strong style="font-weight:500;color:var(--t1);">${fmt(C.exp)}</strong>/mo</span>
    <div style="display:flex;gap:8px;">
      <button onclick="addCat()">+ Category</button>
      <button onclick="addExp()">+ Expense</button>
    </div>
  </div>
  ${uncat.length ? uncatSec(uncat) : ''}
  <div style="display:flex;flex-direction:column;gap:10px;">
    ${S.categories.map(cat => expCat(cat, C.byCat[cat] || 0, C)).join('')}
  </div>
  <p style="margin-top:8px;font-size:11px;color:var(--t2);">Click to edit · ⠿ drag to reorder or move between categories</p>`;
    }

    function uncatSec(items) {
      return `<div style="background:var(--bg1);border:1px solid var(--brw);border-radius:var(--rlg);overflow:hidden;margin-bottom:10px;">
  <div style="padding:9px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:0.5px solid var(--brw);background:var(--bgw);"
    ondragover="cDO(event,'Uncategorized')" ondrop="cDP(event,'Uncategorized')" ondragleave="cDL()">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="width:8px;height:8px;border-radius:50%;background:var(--brw);display:inline-block;"></span>
      <span style="font-size:13px;font-weight:500;color:var(--tw);">Review — assign a category</span>
    </div>
    <span style="font-size:11px;color:var(--tw);">${items.length} item${items.length !== 1 ? 's' : ''} need a category</span>
  </div>
  <table style="width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;">
    <tbody>${items.map(e => expRow(e)).join('')}</tbody>
  </table></div>`;
    }

    function expCat(cat, total, C) {
      const items = S.expenses.filter(e => e.cat === cat);
      const col = cc(cat), share = C.earn > 0 ? Math.round(total / C.earn * 100) : 0;
      const empty = `<tr><td colspan="5" style="padding:18px 14px;text-align:center;font-size:12px;color:var(--t3);font-style:italic;" ondragover="cDO(event,'${cat}')" ondrop="cDP(event,'${cat}')" ondragleave="cDL()">Drop items here</td></tr>`;
      return `<div style="background:var(--bg1);border:0.5px solid var(--br);border-radius:var(--rlg);overflow:hidden;">
  <div id="ch-${cat}" style="padding:9px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:0.5px solid var(--br);background:var(--bg2);"
    ondragover="cDO(event,'${cat}')" ondrop="cDP(event,'${cat}')" ondragleave="cDL()">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="width:8px;height:8px;border-radius:50%;background:${col};display:inline-block;"></span>
      <span style="font-size:13px;font-weight:500;">${cat}</span>
    </div>
    <div><span style="font-size:13px;font-weight:500;">${fmt(total)}</span><span style="font-size:11px;color:var(--t2);margin-left:6px;">${share}% of take-home</span></div>
  </div>
  <table style="width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;">
    <tbody>${items.length ? items.map(e => expRow(e)).join('') : empty}</tbody>
  </table></div>`;
    }

    function expRow(e) {
      if (S.editing === 'exp-' + e.id) return `<tr style="background:var(--bg2);">
    <td style="padding:6px 8px;width:5%;"></td>
    <td style="padding:6px 8px;width:32%;"><input value="${e.name}" onchange="ue(${e.id},'name',this.value)" style="width:100%;"></td>
    <td style="padding:6px 8px;width:22%;"><select onchange="ue(${e.id},'cat',this.value)" style="width:100%;">${[...S.categories, 'Uncategorized'].map(c => `<option ${e.cat === c ? 'selected' : ''}>${c}</option>`).join('')}</select></td>
    <td style="padding:6px 8px;width:14%;"><input type="number" placeholder="Due" value="${e.due || ''}" onchange="ue(${e.id},'due',this.value?+this.value:null)" style="width:100%;" min="1" max="31"></td>
    <td style="padding:6px 8px;width:27%;text-align:right;">
      <input type="number" value="${e.cost}" onchange="ue(${e.id},'cost',+this.value)" style="width:60px;text-align:right;">
      <button onclick="snd()" style="margin-left:4px;font-size:11px;padding:2px 6px;">✓</button>
      <button onclick="delExp(${e.id})" style="font-size:11px;padding:2px 5px;color:var(--td);">✕</button>
    </td></tr>`;
      return `<tr data-exp-id="${e.id}" data-exp-cat="${e.cat}" draggable="true"
    ondragstart="eDS(event,${e.id},'${e.cat}')" ondragover="eDO(event,${e.id},'${e.cat}')"
    ondragleave="eDL(${e.id})" ondrop="eDP(event,${e.id},'${e.cat}')" ondragend="eDE(${e.id})"
    style="border-bottom:0.5px solid var(--br);">
  <td style="padding:10px 4px 10px 10px;width:5%;color:var(--t3);font-size:15px;cursor:grab;user-select:none;" onclick="event.stopPropagation()">⠿</td>
  <td style="padding:10px 6px;width:32%;cursor:pointer;" onclick="if(!dragging)edit('exp-${e.id}')">${e.name}</td>
  <td style="padding:10px 6px;width:22%;cursor:pointer;" onclick="if(!dragging)edit('exp-${e.id}')"></td>
  <td style="padding:10px 6px;width:14%;color:var(--t2);font-size:12px;cursor:pointer;" onclick="if(!dragging)edit('exp-${e.id}')">${e.due ? `${e.due}${ord(e.due)}` : '—'}</td>
  <td style="padding:10px 12px 10px 6px;width:27%;text-align:right;font-weight:500;cursor:pointer;" onclick="if(!dragging)edit('exp-${e.id}')">${fmt(e.cost)}</td>
  </tr>`;
    }

    /* ══ CALENDAR TAB ════════════════════════════════════════ */
    function calTab() {
      const y = S.calYear, m = S.calMonth, today = new Date();
      const dim = new Date(y, m + 1, 0).getDate();
      const fd = new Date(y, m, 1).getDay();
      const isToday = (d) => d && today.getFullYear() === y && today.getMonth() === m && today.getDate() === d;

      // Count paydays per source this month (for amount splitting)
      function srcPayCount(src) {
        if (src.paydayType === 'weekdays') { let n = 0; for (let d = 1; d <= dim; d++) { const dw = new Date(y, m, d).getDay(); if ((src.paydayWeekdays || []).includes(dw)) n++; } return n || 1; }
        return (src.paydayDates || []).filter(d => d <= dim).length || 1;
      }

      // Build events per day — paydays always green, bills use category color
      const PAY_COL = '#639922';
      const evs = {};
      function addEv(d, o) { if (d >= 1 && d <= dim) { if (!evs[d]) evs[d] = []; evs[d].push(o); } }

      if (S.calShowPaydays) {
        S.income.forEach(src => {
          if (!src.showOnCal) return;
          const mo = eMo(src), n = srcPayCount(src), amt = Math.round(mo / n);
          if (src.paydayType === 'weekdays') {
            for (let d = 1; d <= dim; d++) { const dw = new Date(y, m, d).getDay(); if ((src.paydayWeekdays || []).includes(dw)) addEv(d, { label: src.name, col: PAY_COL, kind: 'pay', amt, srcId: src.id, fromDay: new Date(y, m, d).getDay(), draggable: true, isWeekday: true }); }
          } else { (src.paydayDates || []).forEach(d => { if (d <= dim) addEv(d, { label: src.name, col: PAY_COL, kind: 'pay', amt, srcId: src.id, fromDay: d, draggable: true }); }); }
        });
      }
      if (S.calShowBills) {
        S.expenses.filter(e => e.due && e.cat !== 'Uncategorized' && e.showOnCal !== false).forEach(e => {
          addEv(e.due, { label: e.name, col: cc(e.cat), kind: 'bill', amt: e.cost, expId: e.id, fromDay: e.due, draggable: true });
        });
      }

      // Build grid
      const cells = [];
      for (let i = 0; i < fd; i++)cells.push(null);
      for (let d = 1; d <= dim; d++)cells.push(d);
      while (cells.length % 7 !== 0) cells.push(null);
      const weeks = []; for (let i = 0; i < cells.length; i += 7)weeks.push(cells.slice(i, i + 7));

      const CELL_H = 120;
      const calGrid = `<table style="width:100%;border-collapse:collapse;table-layout:fixed;">
    <thead><tr>${DAYS_SHORT.map(d => `<th style="padding:7px 4px;text-align:center;font-size:12px;font-weight:500;color:var(--t2);width:calc(100%/7);">${d}</th>`).join('')}</tr></thead>
    <tbody>${weeks.map(wk => `<tr style="height:${CELL_H}px;">${wk.map(d => {
        if (!d) return `<td style="height:${CELL_H}px;border:0.5px solid var(--br);background:var(--bg2);opacity:0.35;"></td>`;
        const todaySt = isToday(d) ? 'background:var(--bgi);' : '';
        const dayEvs = evs[d] || [];
        const maxShow = Math.floor((CELL_H - 28) / 26);
        return `<td data-cal-day="${d}" style="height:${CELL_H}px;max-height:${CELL_H}px;vertical-align:top;border:0.5px solid var(--br);${todaySt}padding:4px 5px;overflow:hidden;"
        ondragover="calDO(event,${d})" ondragleave="calDL(${d})" ondrop="calDP(event,${d})">
        <div style="font-size:12px;font-weight:${isToday(d) ? '500' : '400'};color:${isToday(d) ? 'var(--ti)' : 'var(--t2)'};margin-bottom:4px;text-align:right;">${d}</div>
        <div style="display:flex;flex-direction:column;gap:3px;">
          ${dayEvs.slice(0, maxShow).map(ev => {
          const drag = ev.draggable;
          const refId = ev.kind === 'pay' ? ev.srcId : ev.expId;
          return `<div
              class="cal-pill"
              ${drag ? `data-kind="${ev.kind}" data-ref="${refId}" data-from="${ev.fromDay}" onmousedown="pillGrab(event,this,'${ev.kind}',${refId},${ev.fromDay},${ev.isWeekday ? 1 : 0})"` : ''}
              style="font-size:11px;padding:3px 6px;border-radius:4px;background:${ev.col};margin-bottom:1px;${drag ? 'cursor:grab;' : ''}">
              <div style="font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;">${ev.kind === 'pay' ? '↑' : '↓'} ${ev.label}</div>
              <div style="color:rgba(255,255,255,0.88);font-size:10px;font-weight:500;line-height:1.2;">${fmt(ev.amt)}</div>
            </div>`;
        }).join('')}
          ${dayEvs.length > maxShow ? `<div style="font-size:10px;color:var(--t3);padding-left:4px;">+${dayEvs.length - maxShow} more</div>` : ''}
        </div>
      </td>`;
      }).join('')}</tr>`).join('')}
    </tbody></table>`;

      // Bills list — sorted by due date
      const bills = S.expenses.filter(e => e.due != null && e.cat !== 'Uncategorized').sort((a, b) => a.due - b.due);
      const billsHtml = `
  <div style="background:var(--bg1);border:0.5px solid var(--br);border-radius:var(--rlg);overflow:hidden;margin-top:1rem;">
    <div style="padding:9px 14px;border-bottom:0.5px solid var(--br);background:var(--bg2);display:flex;justify-content:space-between;">
      <span style="font-size:13px;font-weight:500;">Bills with due dates</span>
      <span style="font-size:12px;color:var(--t2);">${fmt(bills.reduce((s, b) => s + b.cost, 0))}/mo · ⠿ drag to reorder · drag onto calendar to change due date</span>
    </div>
    ${bills.length ? `<table style="width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;">
    <tbody>${bills.map(b => billRow(b, today.getDate())).join('')}</tbody>
    </table>`: `<div style="padding:16px 14px;font-size:13px;color:var(--t2);">No bills with due dates set. Edit expenses to add due dates.</div>`}
  </div>`;

      return `
  <div style="background:var(--bg1);border:0.5px solid var(--br);border-radius:var(--rlg);padding:1rem;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <button onclick="prevMo()" style="padding:5px 14px;font-size:16px;">←</button>
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:15px;font-weight:500;min-width:160px;text-align:center;">${MONTHS[m]} ${y}</span>
        <button onclick="goToday()" style="font-size:11px;padding:3px 9px;">Today</button>
      </div>
      <button onclick="nextMo()" style="padding:5px 14px;font-size:16px;">→</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button class="tog-btn" onclick="S.calShowPaydays=!S.calShowPaydays;render()" style="font-size:12px;padding:4px 12px;background:${S.calShowPaydays ? '#639922' : 'none'};color:${S.calShowPaydays ? '#fff' : 'var(--t1)'};">↑ Paydays</button>
      <button class="tog-btn" onclick="S.calShowBills=!S.calShowBills;render()" style="font-size:12px;padding:4px 12px;background:${S.calShowBills ? '#E24B4A' : 'none'};color:${S.calShowBills ? '#fff' : 'var(--t1)'};">↓ Bills</button>
    </div>
    ${calGrid}
  </div>
  ${billsHtml}`;
    }

    function billRow(b, todayDate) {
      const past = b.due < todayDate, isToday = b.due === todayDate, days = b.due - todayDate;
      const calOn = b.showOnCal !== false, bCol = cc(b.cat);
      return `<tr data-bill-id="${b.id}" draggable="true"
    ondragstart="bDS(event,${b.id})" ondragover="bDO(event,${b.id})"
    ondragleave="bDL(${b.id})" ondrop="bDP(event,${b.id})" ondragend="bDE(${b.id})"
    style="border-bottom:0.5px solid var(--br);">
  <td style="padding:9px 4px 9px 10px;width:4%;color:var(--t3);font-size:15px;cursor:grab;user-select:none;" onclick="event.stopPropagation()">⠿</td>
  <td style="padding:9px 4px;width:5%;text-align:center;" onclick="togBillCal(${b.id})">
    <span style="font-size:14px;cursor:pointer;color:${calOn ? bCol : 'var(--t3)'};" title="${calOn ? 'Showing' : 'Hidden'} on calendar">●</span>
  </td>
  <td style="padding:9px 6px;width:30%;">${b.name}</td>
  <td style="padding:9px 6px;width:20%;font-size:12px;color:${isToday ? 'var(--tw)' : past ? 'var(--t3)' : 'var(--t2)'};">${b.due}${ord(b.due)}${past ? ' (past)' : isToday ? ' (today)' : `(in ${days}d)`}</td>
  <td style="padding:9px 6px;width:20%;"><span style="font-size:11px;padding:2px 7px;border-radius:20px;background:${bCol}22;color:${bCol};">${b.cat}</span></td>
  <td style="padding:9px 12px 9px 6px;width:21%;text-align:right;font-weight:500;">${fmt(b.cost)}</td>
  </tr>`;
    }

    /* ══ CHARTS ══════════════════════════════════════════════ */
    function charts(C) {
      if (donutC) { donutC.destroy(); donutC = null; } if (barC) { barC.destroy(); barC = null; }
      const de = document.getElementById('c-donut'), be = document.getElementById('c-bar');
      if (!de || !be) return;
      const cats = Object.keys(C.byCat), labels = [...cats, 'GAME'], vals = [...cats.map(c => C.byCat[c]), Math.max(0, C.game)], cols = [...cats.map(c => cc(c)), '#639922'];
      donutC = new Chart(de, { type: 'doughnut', data: { labels, datasets: [{ data: vals, backgroundColor: cols, borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '65%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => { const p = C.earn > 0 ? Math.round(ctx.parsed / C.earn * 100) : 0; return ` ${ctx.label}: ${fmt(ctx.parsed)} (${p}%)`; } } } } } });
      const leg = document.getElementById('donut-leg'); if (leg) leg.innerHTML = labels.map((l, i) => `<span style="display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--t2);"><span style="width:8px;height:8px;border-radius:2px;background:${cols[i]};display:inline-block;"></span>${l}</span>`).join('');
      barC = new Chart(be, { type: 'bar', data: { labels: ['Gross', 'Take-home', 'Expenses', 'GAME'], datasets: [{ data: [C.gross, C.earn, C.exp, C.game], backgroundColor: ['#888780', '#378ADD', '#E24B4A', C.game >= 0 ? '#639922' : '#E24B4A'], borderWidth: 0, borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${fmt(Math.round(ctx.parsed.y))}` } } }, scales: { x: { grid: { display: false }, ticks: { font: { size: 10 } } }, y: { grid: { color: 'rgba(128,128,128,0.1)' }, ticks: { callback: v => '$' + Math.round(v).toLocaleString(), font: { size: 10 } } } } } });
    }

    /* ══ DRAG: INCOME ════════════════════════════════════════ */
    let incDI = null, dragging = false;
    function clrI() { document.querySelectorAll('tr[data-inc-id]').forEach(r => { r.style.borderTop = ''; r.style.opacity = ''; }); }
    function iDS(e, id) { dragging = true; incDI = id; e.dataTransfer.effectAllowed = 'move'; setTimeout(() => { const r = document.querySelector(`tr[data-inc-id="${id}"]`); if (r) r.style.opacity = '0.35'; }, 0); }
    function iDO(e, id) { e.preventDefault(); if (!incDI || incDI === id) return; clrI(); const r = document.querySelector(`tr[data-inc-id="${id}"]`); if (r) { r.style.borderTop = '2px solid #639922'; r.style.opacity = ''; }; }
    function iDL(id) { const r = document.querySelector(`tr[data-inc-id="${id}"]`); if (r) r.style.borderTop = ''; }
    function iDP(e, tid) { e.preventDefault(); clrI(); if (!incDI || incDI === tid) return; const fi = S.income.findIndex(x => x.id === incDI), ti = S.income.findIndex(x => x.id === tid); if (fi < 0 || ti < 0) return; const [item] = S.income.splice(fi, 1); S.income.splice(S.income.findIndex(x => x.id === tid), 0, item); incDI = null; saveState(); render(); }
    function iDE(id) { clrI(); incDI = null; setTimeout(() => { dragging = false; }, 50); }

    /* ══ DRAG: EXPENSES ══════════════════════════════════════ */
    let expDS = null;
    function clrE() { document.querySelectorAll('tr[data-exp-id]').forEach(r => { r.style.borderTop = ''; r.style.opacity = ''; }); document.querySelectorAll('[id^="ch-"]').forEach(h => h.style.outline = ''); }
    function eDS(e, id, cat) { dragging = true; expDS = { id, cat }; e.dataTransfer.effectAllowed = 'move'; setTimeout(() => { const r = document.querySelector(`tr[data-exp-id="${id}"]`); if (r) r.style.opacity = '0.35'; }, 0); }
    function eDO(e, id, cat) { e.preventDefault(); if (!expDS || expDS.id === id) return; clrE(); const r = document.querySelector(`tr[data-exp-id="${id}"]`); if (r) r.style.borderTop = '2px solid #639922'; }
    function eDL(id) { const r = document.querySelector(`tr[data-exp-id="${id}"]`); if (r) r.style.borderTop = ''; }
    function eDP(e, tid, tcat) { e.preventDefault(); clrE(); if (!expDS || expDS.id === tid) return; const fi = S.expenses.findIndex(x => x.id === expDS.id), ti = S.expenses.findIndex(x => x.id === tid); if (fi < 0 || ti < 0) return; const [item] = S.expenses.splice(fi, 1); item.cat = tcat; S.expenses.splice(S.expenses.findIndex(x => x.id === tid), 0, item); expDS = null; saveState(); render(); }
    function eDE(id) { clrE(); expDS = null; setTimeout(() => { dragging = false; }, 50); }
    function cDO(e, cat) { e.preventDefault(); if (!expDS) return; const h = document.getElementById(`ch-${cat}`); if (h) h.style.outline = '2px solid #639922'; }
    function cDL() { document.querySelectorAll('[id^="ch-"]').forEach(h => h.style.outline = ''); }
    function cDP(e, cat) { e.preventDefault(); clrE(); if (!expDS) return; const fi = S.expenses.findIndex(x => x.id === expDS.id); if (fi < 0) return; const [item] = S.expenses.splice(fi, 1); item.cat = cat; const last = S.expenses.reduce((l, x, i) => x.cat === cat ? i : l, -1); S.expenses.splice(last + 1, 0, item); expDS = null; saveState(); render(); }

    /* ══ DRAG: BILLS (calendar) ══════════════════════════════ */
    let billDI = null;
    function clrB() { document.querySelectorAll('tr[data-bill-id]').forEach(r => { r.style.borderTop = ''; r.style.opacity = ''; }); document.querySelectorAll('td[data-cal-day]').forEach(c => c.style.outline = ''); }
    function bDS(e, id) { dragging = true; billDI = id; e.dataTransfer.effectAllowed = 'move'; setTimeout(() => { const r = document.querySelector(`tr[data-bill-id="${id}"]`); if (r) r.style.opacity = '0.35'; }, 0); }
    function bDO(e, id) { e.preventDefault(); if (!billDI || billDI === id) return; clrB(); const r = document.querySelector(`tr[data-bill-id="${id}"]`); if (r) r.style.borderTop = '2px solid #639922'; }
    function bDL(id) { const r = document.querySelector(`tr[data-bill-id="${id}"]`); if (r) r.style.borderTop = ''; }
    function bDP(e, tid) { e.preventDefault(); clrB(); if (!billDI || billDI === tid) return; const fi = S.expenses.findIndex(x => x.id === billDI), ti = S.expenses.findIndex(x => x.id === tid); if (fi < 0 || ti < 0) return; const [item] = S.expenses.splice(fi, 1); S.expenses.splice(S.expenses.findIndex(x => x.id === tid), 0, item); billDI = null; saveState(); render(); }
    function bDE(id) { clrB(); billDI = null; setTimeout(() => { dragging = false; }, 50); }
    // Drop onto calendar cell → change due date
    /* ── CALENDAR PILL MOUSE-DRAG ─────────────────────────── */
    let _cpd = null;
    let _cpGhost = null;

    // pill mousedown is attached directly in attachPillListeners() after render

    document.addEventListener('mousemove', function (e) {
      if (!_cpd) return;
      _cpGhost.style.left = (e.clientX - 40) + 'px';
      _cpGhost.style.top = (e.clientY - 16) + 'px';
      // highlight target cell
      _cpGhost.style.display = 'none';
      const under = document.elementFromPoint(e.clientX, e.clientY);
      _cpGhost.style.display = '';
      document.querySelectorAll('td[data-cal-day]').forEach(c => c.style.outline = '');
      const cell = under && under.closest('td[data-cal-day]');
      if (cell) cell.style.outline = '2px solid #639922';
    });

    document.addEventListener('mouseup', function (e) {
      if (!_cpd) return;
      if (_cpGhost) { _cpGhost.remove(); _cpGhost = null; }
      document.querySelectorAll('td[data-cal-day]').forEach(c => c.style.outline = '');
      _cpGhost = null;
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const cell = under && under.closest('td[data-cal-day]');
      const d = cell ? +cell.dataset.calDay : null;
      const { kind, refId, fromDay } = _cpd;
      _cpd = null;
      if (!d || d === fromDay) return;
      if (kind === 'bill') {
        const exp = S.expenses.find(x => x.id === refId);
        if (exp) { exp.due = d; saveState(); render(); }
      } else if (kind === 'pay') {
        const src = S.income.find(x => x.id === refId);
        if (src && src.paydayType === 'dates') {
          const i = src.paydayDates.indexOf(fromDay);
          if (i >= 0) src.paydayDates.splice(i, 1);
          if (!src.paydayDates.includes(d)) src.paydayDates.push(d);
          src.paydayDates.sort((a, b) => a - b);
          saveState(); render();
        }
      }
    });

    /* ── BILL ROW → CALENDAR DROP (kept for bills list) ────── */
    function calDO(e, d) { e.preventDefault(); if (!billDI) return; document.querySelectorAll('td[data-cal-day]').forEach(c => c.style.outline = ''); const c = document.querySelector(`td[data-cal-day="${d}"]`); if (c) c.style.outline = '2px solid #639922'; }
    function calDL(d) { const c = document.querySelector(`td[data-cal-day="${d}"]`); if (c) c.style.outline = ''; }
    function calDP(e, d) { e.preventDefault(); document.querySelectorAll('td[data-cal-day]').forEach(c => c.style.outline = ''); if (!billDI) return; const exp = S.expenses.find(x => x.id === billDI); if (exp) { exp.due = d; saveState(); } billDI = null; render(); }

    /* ══ DRAG: TABS ══════════════════════════════════════════ */
    let tabDragId = null;
    function tDS(e, t) { tabDragId = t; e.dataTransfer.effectAllowed = 'move'; setTimeout(() => { const el = document.querySelector(`button[data-tab="${t}"]`); if (el) el.style.opacity = '0.4'; }, 0); }
    function tDO(e, t) { e.preventDefault(); if (!tabDragId || tabDragId === t) return; document.querySelectorAll('button[data-tab]').forEach(b => b.style.borderLeft = ''); const el = document.querySelector(`button[data-tab="${t}"]`); if (el) el.style.borderLeft = '2px solid var(--t1)'; }
    function tDP(e, t) { e.preventDefault(); document.querySelectorAll('button[data-tab]').forEach(b => { b.style.borderLeft = ''; b.style.opacity = ''; }); if (!tabDragId || tabDragId === t) return; const fi = S.tabOrder.indexOf(tabDragId), ti = S.tabOrder.indexOf(t); if (fi < 0 || ti < 0) return; S.tabOrder.splice(fi, 1); S.tabOrder.splice(S.tabOrder.indexOf(t), 0, tabDragId); tabDragId = null; saveState(); render(); }
    function tDE() { document.querySelectorAll('button[data-tab]').forEach(b => { b.style.borderLeft = ''; b.style.opacity = ''; }); tabDragId = null; }

    /* ══ ACTIONS ════════════════════════════════════════════ */
    function setTab(t) { S.tab = t; S.editing = null; render(); }
    function edit(k) { S.editing = k; render(); }
    function snd() { S.editing = null; saveState(); render(); }
    function setTax(v) { S.taxRate = Math.min(0.99, Math.max(0, v / 100)); saveState(); render(); }
    function prevMo() { if (S.calMonth === 0) { S.calMonth = 11; S.calYear--; } else S.calMonth--; render(); }
    function nextMo() { if (S.calMonth === 11) { S.calMonth = 0; S.calYear++; } else S.calMonth++; render(); }
    function goToday() { S.calYear = _now.getFullYear(); S.calMonth = _now.getMonth(); render(); }

    function ui(id, f, v) { const s = S.income.find(i => i.id === id); if (s) { s[f] = v; saveState(); } }
    function delInc(id) { S.income = S.income.filter(i => i.id !== id); S.editing = null; saveState(); render(); }
    function addInc() { const n = { id: S.nextId++, name: 'New Source', type: 'Taxed', payType: 'Salary', monthly: 0, rate: null, hrsPerWeek: null, paydayType: 'dates', paydayDates: [], paydayWeekdays: [], showOnCal: true }; S.income.push(n); S.editing = 'inc-' + n.id; saveState(); render(); }
    function togIncCal(id) { const s = S.income.find(i => i.id === id); if (s) { s.showOnCal = s.showOnCal === false; saveState(); render(); } }
    function togPD(id, d) { const s = S.income.find(i => i.id === id); if (!s) return; if (!s.paydayDates) s.paydayDates = []; const i = s.paydayDates.indexOf(d); if (i >= 0) s.paydayDates.splice(i, 1); else s.paydayDates.push(d); s.paydayDates.sort((a, b) => a - b); saveState(); render(); }
    function togWD(id, d) { const s = S.income.find(i => i.id === id); if (!s) return; if (!s.paydayWeekdays) s.paydayWeekdays = []; const i = s.paydayWeekdays.indexOf(d); if (i >= 0) s.paydayWeekdays.splice(i, 1); else s.paydayWeekdays.push(d); saveState(); render(); }

    function ue(id, f, v) { const e = S.expenses.find(e => e.id === id); if (e) { e[f] = v; saveState(); } }
    function delExp(id) { S.expenses = S.expenses.filter(e => e.id !== id); S.editing = null; saveState(); render(); }
    function addExp() { const n = { id: S.nextId++, name: 'New Expense', cat: 'Uncategorized', cost: 0, due: null, showOnCal: true }; S.expenses.unshift(n); S.editing = 'exp-' + n.id; saveState(); render(); }
    function addCat() { const name = prompt('New category name:'); if (!name || !name.trim()) return; const t = name.trim(); if (S.categories.includes(t)) { alert('Already exists.'); return; } const used = Object.values(S.catColors); const col = COLOR_POOL.find(c => !used.includes(c)) || COLOR_POOL[S.categories.length % COLOR_POOL.length]; S.categories.push(t); S.catColors[t] = col; saveState(); render(); }
    function togBillCal(id) { const e = S.expenses.find(e => e.id === id); if (e) { e.showOnCal = e.showOnCal === false; saveState(); render(); } }

    render();
    (async function initSync() {
      if (!window.FirebaseSync?.isConfigured()) return;
      try {
        const cloud = await FirebaseSync.load(SYNC_PAGE);
        if (cloud && !HAD_LOCAL_STATE) {
          applyState(cloud);
          localStorage.setItem(KEY, JSON.stringify(statePayload()));
          render();
        } else {
          await FirebaseSync.save(SYNC_PAGE, statePayload());
        }
        FirebaseSync.subscribe(SYNC_PAGE, data => {
          applyState(data);
          localStorage.setItem(KEY, JSON.stringify(statePayload()));
          render();
        });
      } catch (e) {
        showToast('Cloud sync unavailable');
      }
    })();
  </script>
</body>

</html>
